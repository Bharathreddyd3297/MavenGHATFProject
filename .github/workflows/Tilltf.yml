name: StreamFlix CI CD

on:
  workflow_dispatch:

# Required for GitHub OIDC authentication with AWS
permissions:
  id-token: write
  contents: read


# ============================================================
# STAGE 1 - BUILD AND TEST
# ============================================================
jobs:

  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java version
        run: java -version

      - name: Verify Maven version
        run: mvn -version

      - name: Run tests
        run: mvn clean test

      - name: Build application
        run: mvn clean package

      - name: Verify JAR
        run: |
          ls -lh target/
          test -f target/streamflix-1.0.0.jar


  # ============================================================
  # STAGE 2 - AWS AUTHENTICATION
  # ============================================================
  aws-authentication:
    name: Authenticate with AWS
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubLink
          aws-region: ap-south-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity


  # ============================================================
  # STAGE 3 - TERRAFORM INFRASTRUCTURE
  # ============================================================
  terraform:
    name: Provision AWS Infrastructure
    runs-on: ubuntu-latest

    needs: aws-authentication

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubLink
          aws-region: ap-south-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve