name: All 4 Stages

on:
  workflow_dispatch:

# Required for GitHub OIDC authentication with AWS
permissions:
  id-token: write
  contents: read


# ============================================================
# STAGE 1 - BUILD AND TEST
# ============================================================
jobs:

  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java version
        run: java -version

      - name: Verify Maven version
        run: mvn -version

      - name: Run tests
        run: mvn clean test

      - name: Build application
        run: mvn clean package

      - name: Verify JAR
        run: |
          ls -lh target/
          test -f target/streamflix-1.0.0.jar

      # --------------------------------------------------------
      # Upload JAR as GitHub Actions artifact
      # --------------------------------------------------------
      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamflix-jar
          path: target/streamflix-1.0.0.jar


  # ============================================================
  # STAGE 2 - AWS AUTHENTICATION
  # ============================================================
  aws-authentication:
    name: Authenticate with AWS
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubLink
          aws-region: ap-south-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity


  # ============================================================
  # STAGE 3 - TERRAFORM INFRASTRUCTURE
  # ============================================================
  terraform:
    name: Provision AWS Infrastructure
    runs-on: ubuntu-latest

    needs: aws-authentication

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubLink
          aws-region: ap-south-1

      - name: Verify AWS authentication
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      # --------------------------------------------------------
      # Terraform is commented for now because infrastructure
      # has already been created.
      # --------------------------------------------------------

      # - name: Terraform Plan
      #   working-directory: terraform
      #   run: terraform plan

      # - name: Terraform Apply
      #   working-directory: terraform
      #   run: terraform apply -auto-approve


  # ============================================================
  # STAGE 4 - DEPLOY APPLICATION TO ELASTIC BEANSTALK
  # ============================================================
  deploy:
    name: Deploy to Elastic Beanstalk
    runs-on: ubuntu-latest

    needs: terraform

    steps:

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
            name: streamflix-jar
            path: deployment

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
            role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
            role-session-name: GitHubLink
            aws-region: ap-south-1

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
            aws-region: ap-south-1
            application-name: streamflix
            environment-name: streamflix-env
            version-label: streamflix-${{ github.run_number }}
            deployment-package: deployment/streamflix-1.0.0.jar